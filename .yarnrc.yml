approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @bull-board/nestjs@9.5 henüz Nest 12 peer aralığı yayınlamadı; runtime uyumlu.
# YN0086: yalnızca transitive (Expo/Nest CLI vb.) peer gürültüsü.
logFilters:
  - code: YN0060
    level: discard
    pattern: "*@bull-board/nestjs*"
  - code: YN0086
    level: discard
