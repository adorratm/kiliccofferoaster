name: Deploy Kılıç Coffee

# Build images on GitHub runners → GHCR, then deliver to VPS + rolling recreate.
# Prefer optional GHCR_TOKEN for VPS pull; otherwise runner pulls with GITHUB_TOKEN
# and streams images via docker save|load (avoids GHCR "denied" on the VPS).
# Never docker-build Next/Nest on the shared Hetzner VPS (causes sibling 502).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kiliccoffee-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kiliccofferoaster

jobs:
  build:
    name: Build images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
            build_args: ""
          - service: frontend
            dockerfile: docker/frontend.Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.kiliccoffeeroaster.com.tr
              NEXT_PUBLIC_SITE_URL=https://kiliccoffeeroaster.com.tr
              NEXT_PUBLIC_ADMIN_URL=https://admin.kiliccoffeeroaster.com.tr
          - service: admin
            dockerfile: docker/admin.Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.kiliccoffeeroaster.com.tr
              NEXT_PUBLIC_ADMIN_URL=https://admin.kiliccoffeeroaster.com.tr
              NEXT_PUBLIC_SITE_URL=https://kiliccoffeeroaster.com.tr
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_prefix: ${{ env.IMAGE_PREFIX }}
    steps:
      - uses: actions/checkout@v5

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=kilic-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=kilic-${{ matrix.service }}
          provenance: false

  # Matrix job outputs are flaky; resolve tag/prefix once before SSH deploy.
  prepare:
    name: Resolve image refs
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_prefix: ${{ env.IMAGE_PREFIX }}
    steps:
      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Hetzner
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    # GITHUB_TOKEN can pull on the runner; VPS often gets GHCR "denied".
    # Prefer optional GHCR_TOKEN (classic PAT) for VPS pull; else ship images via docker save|load.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Sync deploy scripts + compose to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          tar czf /tmp/kiliccoffee-deploy.tar.gz \
            --exclude='**/node_modules' \
            --exclude='**/.next' \
            --exclude='**/dist' \
            --exclude='deploy/.env' \
            --exclude='deploy/artifacts/*.sql' \
            api frontend admin docker deploy \
            docker-compose.prod.yml package.json yarn.lock .yarnrc.yml .yarn .dockerignore

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}'"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            /tmp/kiliccoffee-deploy.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/kiliccoffee-deploy.tar.gz"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' && tar xzf /tmp/kiliccoffee-deploy.tar.gz && rm -f /tmp/kiliccoffee-deploy.tar.gz"

      - name: Deliver images to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          remote_ssh() {
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "${SSH_USER}@${SSH_HOST}" "$@"
          }

          if [[ -n "${GHCR_TOKEN:-}" ]]; then
            echo "==> VPS will pull from GHCR with GHCR_TOKEN"
            remote_ssh "printf 'export KILIC_SKIP_PULL=0\\n' > /tmp/kilic-image-mode.env"
            exit 0
          fi

          echo "==> No GHCR_TOKEN — pull on runner with GITHUB_TOKEN, stream to VPS"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

          imgs=()
          for svc in api frontend admin; do
            img="${IMAGE_PREFIX}/${svc}:${IMAGE_TAG}"
            echo "==> docker pull $img"
            docker pull "$img"
            imgs+=("$img")
          done

          echo "==> docker save | ssh docker load (${#imgs[@]} images)"
          docker save "${imgs[@]}" | remote_ssh "docker load"

          echo "==> retag as kiliccoffee-prod-*:live on VPS"
          remote_ssh "set -euo pipefail
            TAG='${IMAGE_TAG}'
            PREFIX='${IMAGE_PREFIX}'
            docker tag \"\${PREFIX}/api:\${TAG}\" kiliccoffee-prod-api:live
            docker tag \"\${PREFIX}/api:\${TAG}\" \"kiliccoffee-prod-api:\${TAG}\"
            docker tag \"\${PREFIX}/frontend:\${TAG}\" kiliccoffee-prod-frontend:live
            docker tag \"\${PREFIX}/frontend:\${TAG}\" \"kiliccoffee-prod-frontend:\${TAG}\"
            docker tag \"\${PREFIX}/admin:\${TAG}\" kiliccoffee-prod-admin:live
            docker tag \"\${PREFIX}/admin:\${TAG}\" \"kiliccoffee-prod-admin:\${TAG}\"
          "

          remote_ssh "printf 'export KILIC_SKIP_PULL=1\\n' > /tmp/kilic-image-mode.env"
          echo "==> Images ready on VPS (skip GHCR pull)"

      - name: Rolling deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m
          envs: KILIC_IMAGE_TAG,KILIC_IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            chmod +x deploy/*.sh deploy/lib/*.sh
            # shellcheck disable=SC1091
            if [[ -f /tmp/kilic-image-mode.env ]]; then
              # shellcheck source=/dev/null
              source /tmp/kilic-image-mode.env
              rm -f /tmp/kilic-image-mode.env
            fi
            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
              export KILIC_SKIP_PULL=0
            fi
            export KILIC_IMAGE_TAG="${KILIC_IMAGE_TAG}"
            export KILIC_IMAGE_PREFIX="${KILIC_IMAGE_PREFIX}"
            export KILIC_USE_REGISTRY=1
            export KILIC_SKIP_PULL="${KILIC_SKIP_PULL:-0}"
            ./deploy/deploy.sh
        env:
          KILIC_IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          KILIC_IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER || github.repository_owner }}

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            API_PORT="$(grep '^API_HOST_PORT=' deploy/.env | cut -d= -f2)"
            API_PORT="${API_PORT:-3202}"
            FE_PORT="$(grep '^FRONTEND_HOST_PORT=' deploy/.env | cut -d= -f2)"
            FE_PORT="${FE_PORT:-3200}"

            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${API_PORT}/health" >/dev/null 2>&1; then
                echo "==> API OK (${i}. deneme)"
                curl -fsS "http://127.0.0.1:${API_PORT}/health"
                echo ""
                break
              fi
              if [[ "$i" -eq 20 ]]; then
                echo "==> API logları:"
                docker logs kiliccoffee-prod-api --tail 100 2>&1 || true
                exit 1
              fi
              echo "Bekleniyor... (${i}/20)"
              sleep 3
            done

            curl -fsS -o /dev/null -w "Frontend HTTP %{http_code}\n" "http://127.0.0.1:${FE_PORT}/" || true
