appId: tr.kiliccoffeeroaster.desktop
productName: Kilic Coffee Roaster
executableName: KilicCoffeeRoaster
directories:
  output: release
files:
  - out/**/*
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - node_modules/sql.js/**/*
publish:
  provider: generic
  url: https://kiliccoffeeroaster.com.tr/downloads/
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: KilicCoffeeRoaster-Setup.${ext}
mac:
  category: public.app-category.shopping
  target:
    - target: dmg
      arch:
        - universal
  icon: resources/icon.png
  artifactName: KilicCoffeeRoaster.${ext}
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Office
  executableName: KilicCoffeeRoaster
  syncDesktopName: true
  maintainer: Kılıç Coffee Roaster <info@kiliccoffeeroaster.com.tr>
  artifactName: KilicCoffeeRoaster.${ext}
